# NewsPulse Intelligence Discovery Engine Configuration

paths:
  data_dir: "."
  output_dir: "output"
  news_csv: "output/data/news_data.csv"
  analyzed_parquet: "output/data/news_analyzed.parquet"
  analyzed_csv: "output/data/news_analyzed.csv"
  update_log: "output/logs/update_log.json"

scraper:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  timeout: 15
  max_articles_per_source: 50
  global_article_cap: 500
  max_workers: 8
  retry_attempts: 3
  retry_backoff: 1.0
  request_delay: 0.0

nlp:
  batch_size: 64
  cache_size: 2048
  entity_threshold: 0.5

quality:
  dedup_threshold: 0.85
  enable_semantic_dedup: true
  enable_boilerplate_removal: true

intelligence:
  min_entity_mentions: 2
  min_link_cooccurrence: 2
  max_cross_domain_links: 200
  max_impact_chains: 50
  llm_verification: true
  llm_max_links: 20
  llm_model: "qwen3:14b"
  multi_agent:
    enabled: true
    analyst_model: "qwen3:14b"
    critic_model: "qwen3:14b"
    summarizer_model: "qwen3:14b"
  temporal:
    enabled: true
    anomaly_std_threshold: 2.0
    burst_z_threshold: 2.5
    min_burst_count: 2
  briefings:
    enabled: true
    include_predictions: true
    max_watch_items: 20

causal:
  enabled: true
  min_lag_hours: 6
  max_lag_days: 14
  lookback_days: 30
  max_candidates: 100
  max_chains: 30

vector_store:
  collection_name: "newspulse"
  embedding_model: "BAAI/bge-m3"
  reranker_model: "BAAI/bge-reranker-v2-m3"
  use_hybrid_search: true
  use_reranker: false

neo4j:
  enabled: false
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: ""

alerts:
  enabled: true
  velocity_acceleration_threshold: 3.0
  velocity_magnitude_threshold: 2.0
  burst_threshold: 3.0
  phase_transition_threshold: 0.7
  relationship_confidence_threshold: 0.8

auth:
  enabled: true
  jwt_secret: ""
  jwt_expiry_hours: 24

export:
  json_dir: "output/exports"
  csv_dir: "output/exports"
  markdown_dir: "output/exports"

scheduler:
  enabled: true
  interval_minutes: 15
  initial_delay_seconds: 10
  fail_safe: true

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
