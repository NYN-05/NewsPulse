# NewsPulse Intelligence Discovery Engine Configuration

paths:
  data_dir: "."
  output_dir: "output"
  data_dir_output: "output/data"
  plots_dir: "output/plots"
  models_dir: "output/models"
  logs_dir: "output/logs"
  news_csv: "output/data/news_data.csv"
  analyzed_parquet: "output/data/news_analyzed.parquet"
  analyzed_csv: "output/data/news_analyzed.csv"
  update_log: "output/logs/update_log.json"

scraper:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  timeout: 15
  max_articles_per_source: 50
  max_workers: 8
  retry_attempts: 3
  retry_backoff: 1.0
  request_delay: 0.0

nlp:
  batch_size: 64
  cache_size: 2048
  sentiment_threshold_positive: 0.35
  sentiment_threshold_negative: -0.35

quality:
  dedup_threshold: 0.85
  enable_semantic_dedup: true
  enable_boilerplate_removal: true

vector_store:
  collection_name: "newspulse"
  embedding_model: "all-MiniLM-L6-v2"

alerts:
  breaking_threshold: 20
  webhooks:
    telegram: ""
    slack: ""
    discord: ""

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
